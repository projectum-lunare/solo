site_name: solo
site_url: https://projectum-lunare.github.io/solo/
site_description: Lightweight, modular C89 and Lua systems programming library for modern and vintage operating systems.
site_author: Gustavo Veiga
repo_name: projectum-lunare/solo
repo_url: https://github.com/projectum-lunare/solo
edit_uri: ""

theme:
  name: material
  language: en
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details

nav:
  - Home: index.md
  - Getting Started:
      - Quickstart Guide: getting-started/index.md
      - Building & Compiling: getting-started/building.md
      - C89 API Usage: getting-started/c-api.md
      - Lua API Usage: getting-started/lua-api.md
  - Architecture:
      - Design Philosophy: architecture/philosophy.md
      - Canonical Type System: architecture/types.md
      - Platform Abstraction Layer: architecture/pal.md
      - PAL Porting Guide: architecture/porting-guide.md
  - Subsystems:
      - Platform Detection: subsystems/platform.md
      - Filesystem & Path I/O: subsystems/filesystem.md
      - Network Sockets: subsystems/socket.md
      - Serial Port (UART): subsystems/serial.md
      - Parallel Port (IEEE 1284): subsystems/parallel.md
      - Kernel Sandboxing: subsystems/sandbox.md
  - Recipes & Guides:
      - Overview: recipes/index.md
      - Asynchronous TCP Echo Server: recipes/tcp-echo-server.md
      - Industrial Serial GPS Reader: recipes/industrial-serial.md
      - Defense-in-Depth CLI Sandbox: recipes/hardened-cli.md
      - Centronics Impact Printing: recipes/parallel-strobe.md
  - Platforms:
      - Support Matrix: platforms/matrix.md
      - Modern POSIX: platforms/posix.md
      - Windows (NT 3.51..11, CE): platforms/windows.md
      - Retro Stacks (DOS, Amiga, Atari): platforms/retro.md
      - Exotic Kernels (KolibriOS, OS/2, Plan 9): platforms/exotic.md
      - Kernel Internals & Gotchas: platforms/internals.md
  - Cross-Compilation:
    - Forge Multi-Target Matrix: cross-compilation/forge.md
